<script>
  /* A reload starts at the top of the page. Links to sections and the Back button still keep their position.
     The browser's own restoring has to stay off on every page, because it reads the setting before this runs. */
  (function () {
    if (!('scrollRestoration' in history)) { return; }
    history.scrollRestoration = 'manual';
    var nav = window.performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    var type = nav ? nav.type : 'navigate';
    var key = 'scroll:' + location.pathname + location.search;
    if (type === 'reload' && location.hash) {
      history.replaceState(null, '', location.pathname + location.search);
    }
    if (type === 'back_forward') {
      window.addEventListener('load', function () {
        var saved = null;
        try { saved = sessionStorage.getItem(key); } catch (e) {}
        if (saved !== null) { window.scrollTo({ top: Number(saved), behavior: 'instant' }); }
      });
    }
    window.addEventListener('pagehide', function () {
      try { sessionStorage.setItem(key, String(window.scrollY)); } catch (e) {}
    });
  })();
</script>
